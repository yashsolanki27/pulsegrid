[project]
name = "pulsegrid-common"
version = "0.1.0"
description = "PulseGrid shared library - LogPulse HTTP client and generic dedup store"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
