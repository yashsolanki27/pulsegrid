# Prometheus configuration for PulseGrid observability stack
# Scrapes: crm-service, erp-service, reconciliation-job (push-gateway), api-health-monitor (push-gateway)
# All scrape targets use the standard prometheus-fastapi-instrumentator /metrics endpoint.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager connection
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alert rules
rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # CRM service — FastAPI with prometheus-fastapi-instrumentator /metrics
  - job_name: crm-service
    static_configs:
      - targets:
          - crm-service:8000
    metrics_path: /metrics

  # ERP service — FastAPI with prometheus-fastapi-instrumentator /metrics
  - job_name: erp-service
    static_configs:
      - targets:
          - erp-service:8001
    metrics_path: /metrics

  # reconciliation-job — Pushgateway target
  # The job pushes metrics at run-time; Prometheus scrapes the gateway.
  - job_name: reconciliation-job
    static_configs:
      - targets:
          - pushgateway:9091
    honor_labels: true

  # Webhook receiver — FastAPI with /metrics
  - job_name: webhook-receiver
    static_configs:
      - targets:
          - webhook-receiver:9094
    metrics_path: /metrics
