server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Discover Docker containers and tail their logs.
  # Labels: job, service, container.
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only scrape containers in the pulsegrid compose project.
      # docker_sd_configs exposes __meta_docker_container_label_com_docker_compose_service.
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_project
        regex: observability-stack
        action: keep
      # Set job label from compose service name.
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        target_label: job
      # Set container label.
      - source_labels:
          - __meta_docker_container_name
        target_label: container
      # Set log stream path to Docker container logs.
      - source_labels:
          - __meta_docker_container_id
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/$1-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: output
