[project]
name = "webhook-receiver"
version = "0.1.0"
description = "PulseGrid Alertmanager webhook receiver — forwards alerts to LogPulse"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "prometheus-fastapi-instrumentator>=6.1",
    "pulsegrid-common",
]

[tool.uv.sources]
pulsegrid-common = { path = "../../pulsegrid_common" }
