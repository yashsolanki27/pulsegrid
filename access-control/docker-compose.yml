# access-control/docker-compose.yml
#
# Standalone compose file for the PulseGrid access-control service.
# Follows the per-service compose convention (mirrors crm-service and erp-service).
#
# IMPORTANT: Uncomment the service block ONLY after completing the Azure AD app
# registration. Required env vars must be present in ../.env (see .env.example).
# Setup steps: docs/patterns.md § "Azure AD app registration (external/manual step)"
#
# To start (from repo root):
#   docker compose -f access-control/docker-compose.yml up --build
#
# Prerequisites:
#   - ../.env populated with AAD_CLIENT_ID, AAD_CLIENT_SECRET, AAD_TENANT_ID,
#     AAD_REDIRECT_URI, SESSION_SECRET_KEY (see .env.example for generation instructions)
#   - crm-service running on host:8000 (or set CRM_SERVICE_URL)
#   - erp-service running on host:8001 (or set ERP_SERVICE_URL)
#   - CRM Postgres accessible on host:5432
#   - ERP Postgres accessible on host:5433
#
# Port: 8002 (host) → 8002 (container)
# Build context: repo root (required for pulsegrid_common path dependency)

services:
